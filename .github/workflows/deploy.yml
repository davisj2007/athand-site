name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # check:content reads the pre-port root HTML from git history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Astro 7.4.2 exits on Node older than 22.23.4. A bare major (22)
      # resolves to the runner's preinstalled 22.x, which is older, so the
      # exact version is pinned to match package.json engines.node.
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: npm
      - uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm run check:external
      - run: npm run check:content
      # npm run tokens:check is deliberately not run here: it compares the
      # copied tokens with the app repo, which is private and not available
      # to this workflow. Run it locally before every PR.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
