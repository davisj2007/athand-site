<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>atHand Open Graph image reference (1200 by 630)</title>
<!-- Design reference only. Same layout as scripts/make-og-image.mjs with the h1
     changed to the new headline (COPY.md OG-1). Production renders it with the
     script, the self-hosted fonts, and the app icon from the app repo; this file
     uses public/apple-touch-icon.png and system font fallbacks. -->
<style>
:root{--surface-page:#F6F5F1;--text-body:#14161C;--text-muted:#4A4C55;--text-link:#4C39C6;
--font-display:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;--font-ui:"Inter",ui-sans-serif,system-ui,sans-serif;--tracking-display:-0.03em}
html,body{margin:0;width:1200px;height:630px}
body{display:flex;align-items:center;gap:72px;padding:0 96px;box-sizing:border-box;background:var(--surface-page);color:var(--text-body)}
.icon{width:280px;height:280px;border-radius:62px;flex:none}
.copy{display:flex;flex-direction:column;gap:28px}
.lockup{display:inline-flex;align-items:center;gap:0.06em;font:700 64px/1 var(--font-display);letter-spacing:var(--tracking-display);color:var(--text-link)}
.lockup svg{height:1em;width:auto}
h1{margin:0;text-wrap:balance;font:700 56px/1.1 var(--font-display);letter-spacing:var(--tracking-display);color:var(--text-body)}
p{margin:0;font:500 30px/1.3 var(--font-ui);color:var(--text-muted)}
</style>
</head>
<body>
<img class="icon" alt="" src="../../../../public/apple-touch-icon.png">
<div class="copy">
<div class="lockup"><svg viewBox="215 30 350 280" fill="none" stroke="currentColor" aria-hidden="true"><path d="M 415 160 A 62 62 0 1 0 291 160 A 62 62 0 1 0 415 160 M 415 100 L 415 188 Q 415 210 437 210 L 545 210" stroke-width="16" stroke-linecap="round"/><path d="M 505 158 L 505 260 Q 505 288 531 288" stroke-width="16" stroke-linecap="round"/><path d="M 470 180 L 470 98 Q 470 45 417 45 L 283 45 Q 230 45 230 98 L 230 232 Q 230 285 283 285 L 417 285 Q 470 285 470 240" stroke-width="9" stroke-linecap="round"/></svg><span>Hand</span></div>
<h1>Your household’s IDs and insurance, ready on your iPhone</h1>
<p>A private household organizer for iPhone</p>
</div>
</body>
</html>
